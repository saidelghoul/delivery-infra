name: DevOps CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create dummy .env
        run: |
          cp .env.example .env
          sed -i 's/=$/=dummy/' .env

      - name: Validate docker-compose syntax
        run: docker compose config
